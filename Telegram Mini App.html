<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моё приложение</title>
<style>
:root{--bg:#f4f4f7;--card:#fff;--tx:#111;--sub:#6b6b78;--ac:#2a8cff;--bd:#e3e3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--card:#1b1b21;--tx:#f2f2f5;--sub:#9a9aa8;--bd:#2a2a33}}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#1b1b21;--tx:#f2f2f5;--sub:#9a9aa8;--bd:#2a2a33}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:26px;margin:8px 0 14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.bar small{color:var(--sub);flex-basis:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1}
.ico{font-size:30px}.price{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.card p{margin:10px 0 0;color:var(--sub);white-space:pre-wrap}
.btn{display:block;text-align:center;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;text-decoration:none;margin-top:12px;width:100%}
.bar .btn{margin:0;width:auto}
.ghost{background:none;border:0;color:var(--ac);font:inherit;padding:10px;width:100%}
.adm{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.adm button{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px;font-size:16px}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--card);width:100%;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 8px}
label{display:block;color:var(--sub);font-size:13px;margin-top:10px}
input,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:16px inherit}
textarea{min-height:80px}
[hidden]{display:none!important}
</style></head>
<body>
<h1 id="title"></h1>
<div class="bar" id="bar" hidden>
<span class="grow">👑 Ты главный</span>
<button class="btn" id="add">＋ Добавить</button>
<small>Нажми на заголовок, чтобы переименовать. Данные сохраняются на этом устройстве.</small>
</div>
<div id="list"></div>
<script>
const KEY='tgapp_v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{title:'Моё приложение',items:[],admin:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function tgUser(){try{const d=new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');if(d)return JSON.parse(new URLSearchParams(d).get('user'))}catch(e){}return null}
const U=tgUser(),uid=U?String(U.id):'local';
if(!S.admin||(S.admin==='local'&&U)){S.admin=uid;save()}
const isAdmin=S.admin===uid;
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
$('#title').textContent=S.title;$('#bar').hidden=!isAdmin;
const box=$('#list');box.textContent='';
if(!S.items.length)box.append(el('p','empty',isAdmin?'Пока пусто. Нажми «＋ Добавить».':'Скоро здесь появится контент.'));
S.items.forEach((it,i)=>{
const c=el('div','card'),h=el('div','row'),b=el('div','grow');
h.append(el('span','ico',it.ico||'✨'));b.append(el('b','',it.title));
if(it.price)b.append(el('span','price',it.price));
h.append(b);c.append(h);
if(it.text)c.append(el('p','',it.text));
if(it.link&&/^(https?:\/\/|tg:\/\/)/i.test(it.link)){const a=el('a','btn',it.btn||'Открыть');a.href=it.link;a.target='_blank';a.rel='noopener';c.append(a)}
if(isAdmin){const r=el('div','adm');
[['↑',()=>mv(i,-1)],['↓',()=>mv(i,1)],['✎',()=>edit(i)],['🗑',()=>del(i)]].forEach(([t,f])=>{const x=el('button','',t);x.onclick=f;r.append(x)});c.append(r)}
box.append(c)})}
function mv(i,d){const j=i+d;if(j<0||j>=S.items.length)return;[S.items[i],S.items[j]]=[S.items[j],S.items[i]];save();render()}
function del(i){if(confirm('Удалить?')){S.items.splice(i,1);save();render()}}
function edit(i){
const it=i==null?{}:{...S.items[i]},m=el('div','modal'),f=el('div','sheet'),inp={};
const F=[['ico','Эмодзи'],['title','Название'],['text','Описание'],['price','Цена / подпись'],['btn','Текст кнопки'],['link','Ссылка (https://...)']];
f.append(el('h3','',i==null?'Новый элемент':'Редактирование'));
F.forEach(([k,l])=>{const lab=el('label','',l),x=document.createElement(k==='text'?'textarea':'input');x.value=it[k]||'';inp[k]=x;lab.append(x);f.append(lab)});
const ok=el('button','btn','Сохранить'),no=el('button','ghost','Отмена');
ok.onclick=()=>{const o={};F.forEach(([k])=>o[k]=inp[k].value.trim());if(!o.title){inp.title.focus();return}
if(i==null)S.items.push(o);else S.items[i]=o;save();m.remove();render()};
no.onclick=()=>m.remove();
f.append(ok,no);m.append(f);document.body.append(m)}
$('#add').onclick=()=>edit(null);
$('#title').onclick=()=>{if(!isAdmin)return;const t=prompt('Название приложения',S.title);if(t&&t.trim()){S.title=t.trim();save();render()}};
render();
</script>
</body></html>
